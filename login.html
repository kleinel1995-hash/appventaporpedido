<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f7f4"><title>Iniciar sesión</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f7f4;font-family:Arial,sans-serif;color:#1d2935;padding:20px}
.card{width:min(420px,100%);background:#fff;border:1px solid #e2e9e4;border-radius:20px;padding:30px;box-shadow:0 14px 40px #173b2512}
.logo{width:54px;height:54px;border-radius:16px;background:#e7f5eb;color:#168342;display:grid;place-items:center;font-size:26px;margin-bottom:18px}
h1{font-size:25px;margin:0 0 8px}p{color:#64748b;line-height:1.5;margin:0 0 24px}
label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}
input{width:100%;padding:14px;border:1px solid #dce5df;border-radius:10px;font-size:16px;outline-color:#168342}
button{width:100%;border:0;border-radius:10px;background:#168342;color:#fff;padding:15px;font-weight:700;font-size:15px;margin-top:22px;cursor:pointer}
#msg{margin-top:14px;font-size:13px;color:#b42318;min-height:18px}
.small{font-size:12px;margin-top:18px;color:#87928b}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body><main class="card">
<div class="logo">↗</div><h1>Bienvenido</h1>
<p>Inicia sesión para acceder a la aplicación y sincronizar los datos.</p>
<form id="loginForm">
<label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">Iniciar sesión</button><div id="msg" role="alert"></div>
</form><div class="small">Las cuentas se crean desde el panel de administración de Supabase. No hay registro público.</div>
</main>
<script>
const client = window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const keys=["products","clientes","historialPedidos","ventasRealizadas","cuentasPorCobrar","ultimaFechaVisita"];
const params=new URLSearchParams(location.search);
document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();const btn=document.getElementById("submit"),msg=document.getElementById("msg");
 btn.disabled=true;btn.textContent="Conectando…";msg.textContent="";
 const {data,error}=await client.auth.signInWithPassword({
  email:document.getElementById("email").value.trim(),
  password:document.getElementById("password").value
 });
 if(error){msg.textContent=error.message;btn.disabled=false;btn.textContent="Iniciar sesión";return;}
 const {data:rows,error:readError}=await client.from("app_data").select("id,data");
 if(readError){msg.textContent="Sesión iniciada, pero no se pudieron cargar los datos: "+readError.message;btn.disabled=false;btn.textContent="Iniciar sesión";return;}
 const cloudKeys=new Set((rows||[]).map(row=>row.id));
 for(const row of rows||[])if(keys.includes(row.id))localStorage.setItem(row.id,JSON.stringify(row.data??[]));
 // Primera conexión: sube datos locales para las claves que todavía no existen en la nube.
 for(const key of keys){
  if(!cloudKeys.has(key)){
   const raw=localStorage.getItem(key);
   if(raw!==null){
    let value;try{value=JSON.parse(raw)}catch{value=raw}
    const {error:uploadError}=await client.from("app_data").upsert(
     {id:key,data:value,updated_at:new Date().toISOString()},{onConflict:"id"}
    );
    if(uploadError){msg.textContent="No se pudo migrar "+key+": "+uploadError.message;btn.disabled=false;btn.textContent="Iniciar sesión";return;}
   }
  }
 }
 const next=params.get("next");
 location.replace(next && !next.startsWith("http") ? next : "menu.html");
});
(async()=>{const {data}=await client.auth.getSession();if(data.session)location.replace(params.get("next")||"menu.html")})();
</script></body></html>
